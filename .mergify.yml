
queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = CI
    merge_method: squash
    batch_size: 1
    branch_protection_injection_mode: merge

pull_request_rules:
  - name: Queue test pull requests
    conditions:
      - base = main
      - label = queue-test
    actions:
      queue:
        name: default
