
queue_rules:
  - name: default
    queue_conditions:
      - base = main
    merge_conditions:
      - check-success = CI
    merge_method: squash
    batch_size: 1
    branch_protection_injection_mode: merge

pull_request_rules:
  - name: Queue test pull requests
    conditions:
      - base = main
      - label = queue-test
    actions:
      queue:
        name: default
        
priority_rules:
  - name: critical-priority-test
    conditions:
      - label = priority-critical
    priority: 5000

  - name: normal-priority-test
    conditions:
      - label = priority-normal
    priority: 2000

  - name: low-priority-test
    conditions:
      - label = priority-low
    priority: 1000
    
